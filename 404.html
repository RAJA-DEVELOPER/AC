<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Page Not Found | ArcticCool</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body { min-height: 100vh; background: var(--midnight); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

    /* Animated background */
    .error-bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(78,168,222,0.12) 0%, transparent 60%), radial-gradient(ellipse at 70% 60%, rgba(15,91,99,0.15) 0%, transparent 60%), var(--midnight);
    }
    .error-grid {
      position: fixed; inset: 0;
      background-image: linear-gradient(rgba(78,168,222,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(78,168,222,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    /* Floating particles */
    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(78,168,222,0.15);
      animation: floatPart linear infinite;
    }

    /* 404 display */
    .error-content { position: relative; z-index: 1; text-align: center; padding: var(--sp-8); max-width: 600px; }
    .error-number {
      font-family: var(--font-heading); font-size: clamp(8rem, 20vw, 16rem);
      font-weight: var(--fw-extrabold); letter-spacing: -0.08em;
      color: transparent;
      background: linear-gradient(135deg, var(--arctic) 0%, rgba(78,168,222,0.3) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      line-height: 0.9; margin-bottom: var(--sp-4);
      filter: drop-shadow(0 0 60px rgba(78,168,222,0.3));
    }
    .error-icon {
      font-size: 4rem; margin-bottom: var(--sp-4);
      animation: float 4s ease-in-out infinite;
      display: block;
    }
    .error-title { font-family: var(--font-heading); font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: var(--fw-bold); color: white; margin-bottom: var(--sp-3); }
    .error-subtitle { color: rgba(255,255,255,0.6); font-size: var(--fs-md); margin-bottom: var(--sp-8); line-height: var(--lh-relaxed); }
    .error-actions { display: flex; gap: var(--sp-4); justify-content: center; flex-wrap: wrap; margin-bottom: var(--sp-10); }
    .error-search { display: flex; max-width: 400px; width: 100%; margin: 0 auto var(--sp-6); }
    .error-search-input { flex: 1; padding: var(--sp-3) var(--sp-5); background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15); border-radius: var(--radius-lg) 0 0 var(--radius-lg); color: white; font-size: var(--fs-sm); outline: none; }
    .error-search-input::placeholder { color: rgba(255,255,255,0.4); }
    .error-search-btn { padding: var(--sp-3) var(--sp-5); background: var(--arctic); border: none; border-radius: 0 var(--radius-lg) var(--radius-lg) 0; cursor: pointer; font-size: 1rem; }
    .error-quick-links { display: flex; gap: var(--sp-3); justify-content: center; flex-wrap: wrap; }
    .error-quick-link { color: rgba(255,255,255,0.6); font-size: var(--fs-sm); text-decoration: none; padding: var(--sp-2) var(--sp-4); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius-full); transition: all var(--t-fast); }
    .error-quick-link:hover { background: rgba(255,255,255,0.1); color: white; }

    /* Countdown redirect */
    .redirect-notice { margin-top: var(--sp-8); font-size: var(--fs-xs); color: rgba(255,255,255,0.4); }

    @keyframes floatPart { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.5; } 100% { transform: translateY(-100px) rotate(720deg); opacity: 0; } }
    @media (max-width: 1024px) {
      .error-content { max-width: 540px; }
    }
    @media (max-width: 768px) {
      .error-content { padding: var(--sp-8) var(--sp-4); }
      .error-number { font-size: clamp(6rem, 18vw, 12rem); }
    }
    @media (max-width: 480px) {
      .error-content { padding: var(--sp-6) var(--sp-4); }
      .error-search { flex-direction: column; }
      .error-search-input { border-radius: var(--radius-lg); }
      .error-search-btn { border-radius: var(--radius-lg); padding: var(--sp-3); margin-top: var(--sp-2); width: 100%; }
      .error-quick-links { gap: var(--sp-2); }
      .error-quick-link { padding: var(--sp-2) var(--sp-3); font-size: var(--fs-xs); }
    }
    @media (max-width: 360px) {
      .error-number { font-size: 6rem; }
      .error-icon { font-size: 2.75rem; }
      .error-title { font-size: 1.5rem; }
      .error-actions { flex-direction: column; width: 100%; }
      .error-actions .btn { width: 100%; }
    }
    @media (max-width: 320px) {
      .error-content { padding: var(--sp-4) var(--sp-2); }
      .error-number { font-size: 4.8rem; }
      .error-icon { font-size: 2.2rem; }
      .error-title { font-size: 1.25rem; }
      .error-subtitle { font-size: 12px; margin-bottom: var(--sp-5); }
      .error-actions .btn { font-size: 12px; padding: 0.6rem; }
      .error-quick-link { font-size: 10px; padding: 3px 8px; }
    }
  </style>
</head>
<body>
<div class="error-bg" aria-hidden="true"></div>
<div class="error-grid" aria-hidden="true"></div>

<!-- Particles -->
<div id="particles" aria-hidden="true"></div>

<header style="position:fixed; top:0; left:0; right:0; z-index:50; padding:var(--sp-4) var(--sp-6);">
  <div style="display:flex; align-items:center; justify-content:space-between; max-width:1400px; margin:0 auto;">
    <a href="index.html" class="nav-logo"><div class="nav-logo-icon"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg></div><span class="nav-logo-text">Arctic<span>Cool</span></span></a>
    <div style="display:flex; gap:var(--sp-3);">
      <button class="theme-toggle" aria-label="Toggle theme"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <a href="index.html" class="btn btn--outline-white btn--sm">← Back Home</a>
    </div>
  </div>
</header>

<main class="error-content" role="main">
  <span class="error-icon" aria-hidden="true"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg></span>
  <div class="error-number" aria-hidden="true">404</div>
  <h1 class="error-title">Page Has Gone Cold</h1>
  <p class="error-subtitle">The page you're looking for seems to have frozen over.<br>Let's warm things up and get you back on track.</p>

  <!-- Search -->
  <div style="margin-bottom:var(--sp-6);">
    <form class="error-search" onsubmit="event.preventDefault(); window.ArcticCool?.ToastManager.show('Search functionality coming soon!','info');" role="search">
      <input type="search" class="error-search-input" placeholder="Search for pages, services..." aria-label="Search the website">
      <button type="submit" class="error-search-btn" aria-label="Submit search"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    </form>
  </div>

  <!-- CTAs -->
  <div class="error-actions">
    <a href="index.html" class="btn btn--primary btn--lg"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> Go to Homepage</a>
    <a href="contact.html" class="btn btn--outline-white"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg> Contact Support</a>
  </div>

  <!-- Quick Links -->
  <div>
    <p style="color:rgba(255,255,255,0.4); font-size:var(--fs-xs); margin-bottom:var(--sp-3);">POPULAR PAGES</p>
    <div class="error-quick-links">
      <a href="services.html" class="error-quick-link"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Services</a>
      <a href="contact.html" class="error-quick-link"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> Book Service</a>
      <a href="blog.html" class="error-quick-link"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> Blog</a>
      <a href="about.html" class="error-quick-link"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg> About Us</a>
      <a href="dashboard.html" class="error-quick-link"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg> Dashboard</a>
      <a href="sitemap.html" class="error-quick-link"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg> Sitemap</a>
    </div>
  </div>

  <div class="redirect-notice" id="redirectNotice">
    Auto-redirecting to homepage in <span id="countdown">15</span> seconds
  </div>
</main>

<div class="toast-container" aria-live="polite"></div>
<script src="js/core.js"></script>
<script>
  // Particles
  const container = document.getElementById('particles');
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    const size = Math.random() * 20 + 5;
    p.className = 'particle';
    p.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random() * 100}%;
      animation-duration:${Math.random() * 15 + 8}s;
      animation-delay:${Math.random() * 10}s;
    `;
    container.appendChild(p);
  }

  // Countdown redirect
  let count = 15;
  const el = document.getElementById('countdown');
  const t = setInterval(() => {
    count--;
    if (el) el.textContent = count;
    if (count <= 0) { clearInterval(t); window.location.href = 'index.html'; }
  }, 1000);
</script>
</body>
</html>
