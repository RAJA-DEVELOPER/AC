<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your free ArcticCool account to manage AC bookings and track services online.">
  <title>Create Account — ArcticCool</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    body { min-height: 100vh; background: var(--midnight); }
    .auth-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: 100vh; }
    .auth-visual {
      background: linear-gradient(135deg, var(--teal) 0%, var(--midnight) 100%);
      position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(2rem, 5vw, 5rem);
    }
    .auth-visual-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(78,168,222,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(78,168,222,0.06) 1px, transparent 1px); background-size: 50px 50px; }
    .auth-visual-content { position: relative; z-index: 1; }
    .auth-form-panel { background: var(--bg-primary); display: flex; flex-direction: column; justify-content: center; padding: clamp(2rem, 5vw, 5rem); overflow-y: auto; }
    .auth-form-inner { max-width: 420px; width: 100%; margin: 0 auto; }
    .auth-form-title { font-family: var(--font-heading); font-size: var(--fs-2xl); font-weight: var(--fw-extrabold); color: var(--text-primary); margin-bottom: var(--sp-2); }
    .auth-form-subtitle { color: var(--text-muted); font-size: var(--fs-sm); margin-bottom: var(--sp-8); }
    .social-auth-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    .social-auth-btn { display: flex; align-items: center; justify-content: center; gap: var(--sp-2); padding: var(--sp-3); border: 1.5px solid var(--border-color); border-radius: var(--radius-lg); background: var(--bg-card); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--fw-medium); transition: all var(--t-fast); }
    .social-auth-btn:hover { border-color: var(--arctic); background: rgba(78,168,222,0.04); }
    .auth-divider { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-6) 0; }
    .auth-divider-line { flex: 1; height: 1px; background: var(--border-color); }
    .auth-divider-text { font-size: var(--fs-xs); color: var(--text-muted); white-space: nowrap; }
    .password-strength { display: flex; gap: 4px; margin-top: var(--sp-2); }
    .strength-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--border-color); transition: background 0.3s; }
    .strength-bar.weak { background: #dc2626; }
    .strength-bar.medium { background: #f59e0b; }
    .strength-bar.strong { background: #16a34a; }
    @media (max-width: 1024px) {
      .auth-visual { padding: clamp(2rem, 4vw, 3rem); }
      .auth-form-panel { padding: clamp(2rem, 4vw, 3rem); }
    }
    @media (max-width: 768px) {
      .auth-layout { grid-template-columns: 1fr; }
      .auth-visual { display: none; }
      .auth-form-panel { min-height: 100vh; padding: var(--sp-10) var(--sp-6); }
    }
    @media (max-width: 480px) {
      .auth-form-panel { padding: var(--sp-8) var(--sp-5); }
      .social-auth-grid { grid-template-columns: 1fr; }
      .auth-form-title { font-size: var(--fs-xl); }
      .form-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 360px) {
      .auth-form-panel { padding: var(--sp-6) var(--sp-4); }
      .social-auth-btn { font-size: var(--fs-xs); padding: var(--sp-2); }
      .auth-form-title { font-size: 1.5rem; }
    }
    @media (max-width: 320px) {
      .auth-form-panel { padding: var(--sp-5) var(--sp-3); }
      .auth-form-title { font-size: 1.35rem; }
      .auth-form-subtitle { font-size: 12px; margin-bottom: var(--sp-4); }
      .social-auth-btn { font-size: 11px; padding: 6px 8px; }
      .auth-divider { margin: var(--sp-4) 0; }
      .form-group { margin-bottom: var(--sp-3); }
      .form-input { padding: 0.6rem 0.75rem; font-size: 14px; }
    }
  </style>
</head>
<body>
<div id="page-loader"><div class="loader-logo"><div class="loader-ring"></div><div class="loader-text">Arctic<span>Cool</span></div></div></div>

<div class="auth-layout">
  <!-- Visual Panel -->
  <div class="auth-visual">
    <div class="auth-visual-grid" aria-hidden="true"></div>
    <div class="auth-visual-content">
      <a href="index.html" style="display:flex;align-items:center;gap:var(--sp-3);text-decoration:none;margin-bottom:clamp(3rem, 10vh, 8rem);">
        <div class="nav-logo-icon"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/></svg></div>
        <span class="nav-logo-text" style="font-size:var(--fs-xl);">Arctic<span>Cool</span></span>
      </a>
      <h1 style="font-family:var(--font-heading); font-size:clamp(2rem,4vw,3.5rem); font-weight:var(--fw-extrabold); color:white; letter-spacing:-0.04em; line-height:1.1; margin-bottom:var(--sp-4);">
        Join 50,000+<br><span style="color:var(--arctic);">happy</span><br>customers.
      </h1>
      <p style="color:rgba(255,255,255,0.6); font-size:var(--fs-md); max-width:38ch; line-height:1.7;">
        Get exclusive member discounts, priority booking and real-time service tracking from day one.
      </p>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-inner reveal-up">
      <div style="margin-bottom:var(--sp-8);">
        <div class="auth-form-title">Create your account <svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg></div>
        <div class="auth-form-subtitle">Join free — no credit card required</div>
      </div>

      <div class="social-auth-grid">
        <button class="social-auth-btn" onclick="window.location.href='index.html'">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg> Google
        </button>
        <button class="social-auth-btn" onclick="window.location.href='index.html'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701zM12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09z"/></svg> Apple
        </button>
      </div>

      <div class="auth-divider"><div class="auth-divider-line"></div><span class="auth-divider-text">or sign up with email</span><div class="auth-divider-line"></div></div>

      <form id="signupForm" data-validate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="signupFirst">First Name *</label>
            <input type="text" id="signupFirst" class="form-input" placeholder="Rahul" required minlength="2" autocomplete="given-name">
            <span class="form-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupLast">Last Name *</label>
            <input type="text" id="signupLast" class="form-input" placeholder="Mehta" required minlength="2" autocomplete="family-name">
            <span class="form-error"></span>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email Address *</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="rahul@example.com" required autocomplete="email">
          <span class="form-error"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPhone">Phone Number *</label>
          <input type="tel" id="signupPhone" class="form-input" placeholder="+91 98765 43210" required autocomplete="tel">
          <span class="form-error"></span>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupCity">City</label>
          <select id="signupCity" class="form-select">
            <option value="">Select your city</option>
            <option>Mumbai</option><option>Delhi</option><option>Bengaluru</option>
            <option>Chennai</option><option>Hyderabad</option><option>Pune</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password *</label>
          <div style="position:relative;">
            <input type="password" id="signupPassword" class="form-input" placeholder="Min. 8 characters" required minlength="8" autocomplete="new-password" style="padding-right:3rem;" oninput="checkStrength(this.value)">
            <button type="button" style="position:absolute;right:var(--sp-4);top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);" onclick="this.previousElementSibling.type=this.previousElementSibling.type==='password'?'text':'password'"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <div class="password-strength"><div class="strength-bar" id="sb1"></div><div class="strength-bar" id="sb2"></div><div class="strength-bar" id="sb3"></div><div class="strength-bar" id="sb4"></div></div>
          <span class="form-error"></span>
        </div>
        <div class="form-group">
          <label style="display:flex; align-items:flex-start; gap:var(--sp-2); font-size:var(--fs-sm); cursor:pointer; color:var(--text-secondary); line-height:1.5;">
            <input type="checkbox" id="acceptTerms" required style="accent-color:var(--arctic); margin-top:2px; flex-shrink:0;">
            <span>I agree to the <a href="terms.html" style="color:var(--arctic);">Terms & Conditions</a> and <a href="privacy.html" style="color:var(--arctic);">Privacy Policy</a></span>
          </label>
        </div>

        <button type="button" class="btn btn--primary btn--full btn--lg" onclick="doSignup()">Create Free Account →</button>

        <div style="text-align:center; margin-top:var(--sp-5); font-size:var(--fs-sm); color:var(--text-muted);">
          Already have an account? <a href="login.html" style="color:var(--arctic); font-weight:var(--fw-semibold);">Sign in →</a>
        </div>
      </form>

      <div style="display:flex; align-items:center; justify-content:center; gap:var(--sp-3); margin-top:var(--sp-6); padding-top:var(--sp-5); border-top:1px solid var(--border-color);">
        <button class="theme-toggle" style="background:var(--bg-tertiary); border:1px solid var(--border-color); border-radius:var(--radius-full); padding:var(--sp-2) var(--sp-4); font-size:var(--fs-sm);" aria-label="Toggle theme"><svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> Dark Mode</button>
        <a href="index.html" style="font-size:var(--fs-xs); color:var(--text-muted);">← Back to website</a>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" aria-live="polite"></div>
<script src="js/core.js"></script>
<script src="js/animations.js"></script>
<script>
function checkStrength(val) {
  const bars = [document.getElementById('sb1'), document.getElementById('sb2'), document.getElementById('sb3'), document.getElementById('sb4')];
  bars.forEach(b => b.className = 'strength-bar');
  if (val.length >= 4) bars[0].classList.add('weak');
  if (val.length >= 6) bars[1].classList.add('medium');
  if (val.length >= 8) bars[2].classList.add('strong');
  if (val.length >= 10 && /[!@#$%^&*]/.test(val)) bars[3].classList.add('strong');
}

function doSignup() {
  const first = document.getElementById('signupFirst').value;
  const email = document.getElementById('signupEmail').value;
  const pass = document.getElementById('signupPassword').value;
  const terms = document.getElementById('acceptTerms').checked;
  if (!first || !email || !pass) { window.ArcticCool?.ToastManager.show('Please fill all required fields', 'error'); return; }
  if (!terms) { window.ArcticCool?.ToastManager.show('Please accept terms & conditions', 'error'); return; }
  const btn = document.querySelector('#signupForm .btn--primary');
  btn.textContent = 'Creating account...';
  btn.disabled = true;
  setTimeout(() => {
    window.ArcticCool?.ToastManager.show('Account created! Welcome to ArcticCool! <svg class="ac-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 13-.82-.33c-.86-.34-1.82.2-1.98 1.11c-.11.7-.72 1.22-1.43 1.22H17"/><path d="m11 2 .33.82c.34.86-.2 1.82-1.11 1.98C9.52 4.9 9 5.52 9 6.23V7"/><path d="M11 13c1.93 1.93 2.83 4.17 2 5-.83.83-3.07-.07-5-2-1.93-1.93-2.83-4.17-2-5 .83-.83 3.07.07 5 2z"/></svg>', 'success', 3000);
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  }, 1500);
}
</script>
</body>
</html>
